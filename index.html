<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Крипто-разбор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=202608240336">
<!-- SDK Telegram обязан загрузиться ДО остальных скриптов: тему и данные
     пользователя спрашивают у него с первой строки. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="stage">
  <div class="device">
    <main id="screen" class="screen"></main>
    <nav id="tabbar" class="tabbar"></nav>
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div id="sheet" class="sheet"><div class="sheet-inner"></div></div>
    <div id="toast" class="toast"></div>
  </div>
</div>

<!-- ?v= проставляет publish_webapp.py при каждой публикации. Без версии
     браузер и вебвью Telegram отдают закэшированные файлы, и человек
     продолжает видеть старую сборку, пока не почистит кэш вручную. -->
<script src="config.js?v=202608240336"></script>
<script src="ui.js?v=202608240336"></script>
<script src="app.js?v=202608240336"></script>
</body>
</html>
